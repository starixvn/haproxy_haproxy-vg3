backend nex3_l3_game_client_LOCAL_2_be
    option forwardfor
    option http-server-close
    option httpchk HEAD /
    http-check expect status 200
    cookie serverid insert
    server-template game_client_local2_ 1 l3_game_client_LOCAL_2:80 check resolvers docker init-addr none

