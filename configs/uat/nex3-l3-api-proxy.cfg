
backend nex3_l3_game_server_SIT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 200
    cookie serverid insert
    http-request set-path %[path,regsub(^/sit/main/,/)]
    server-template l3_game_server_SIT_ 1 l3_game_server_SIT:5000 check resolvers docker init-addr none

