#frontend nex3_l3_game_result_SIT_fe
#    bind *:8782
#    mode  http
#    option forwardfor
#    default_backend nex3_l3_game_result_SIT_be

backend nex3_l3_game_result_SIT_be
    option forwardfor
    option http-server-close
    option httpchk GET /
    http-check expect status 302
    cookie serverid insert
    server-template l3_game_result_SIT_ 1 l3_game_result_SIT:5000 check resolvers docker init-addr none

